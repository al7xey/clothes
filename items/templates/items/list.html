{% extends "base.html" %}

{% block title %}Вещи{% endblock %}

{% block content %}
<h1>Вещи</h1>
<p class="text-muted">Всего вещей: {{ items|length }}</p>
<ul class="list-group">
    {% for item in items %}
        {% include "items/includes/item_row.html" %}
    {% empty %}
        <li class="list-group-item">Вещей пока нет.</li>
    {% endfor %}
</ul>
{% endblock %}
